# Desenvolvimento: banco H2 real em arquivo, com SQL no modo Oracle.
spring.datasource.url=jdbc:h2:file:./data/bairroemdia;MODE=Oracle;DATABASE_TO_UPPER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema-local.sql
spring.sql.init.data-locations=classpath:data-local.sql
